<!DOCTYPE html>
<html>
<head>
<style>

/* =========================================================
   🌈♟️ VARIANT LOVERS CLUB — NEW MEMBERS
   ========================================================= */

html, body {
    background: transparent !important;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #ffffff;
}

/* =========================================================
   MAIN CARD
   ========================================================= */

.vortex-card {
    width: 240px;

    background:
        radial-gradient(circle at 0% 0%, rgba(255,0,128,.20), transparent 38%),
        radial-gradient(circle at 100% 0%, rgba(0,200,255,.20), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(120,0,255,.20), transparent 45%),
        linear-gradient(145deg,#090014,#10102b,#050014);

    border: 1px solid rgba(180,120,255,.45);
    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.65),
        0 0 25px rgba(130,50,255,.18);

    position: relative;
    overflow: hidden;
}

/* =========================================================
   COLOURFUL ATMOSPHERE
   ========================================================= */

.vortex-card::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    top: -145px;
    right: -80px;

    background:
        conic-gradient(
            from 0deg,
            rgba(255,0,128,.20),
            rgba(255,180,0,.15),
            rgba(0,255,200,.18),
            rgba(80,80,255,.18),
            rgba(255,0,128,.20)
        );

    border-radius: 50%;
    filter: blur(20px);

    pointer-events: none;
}

.vortex-card::after {
    content: "♟   ✦   ♞   ✧   ♜   ·   ♝";

    position: absolute;

    top: 8px;
    right: 8px;

    color: rgba(255,255,255,.20);

    font-size: 8px;
    letter-spacing: 3px;

    pointer-events: none;
}

/* =========================================================
   HEADER
   ========================================================= */

.header-section {
    background:
        linear-gradient(
            135deg,
            rgba(35,15,70,.96),
            rgba(10,15,40,.97)
        );

    padding: 14px 16px;

    display: flex;
    align-items: center;

    border-bottom: 1px solid rgba(180,100,255,.30);

    position: relative;
}

.header-section::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -1px;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            #ff0080,
            #ff8a00,
            #ffe600,
            #00e5ff,
            #6c5ce7,
            #ff0080
        );
}

/* =========================================================
   HEADER ICON
   ========================================================= */

.header-icon {
    width: 30px;
    height: 30px;

    background:
        linear-gradient(
            135deg,
            #ff0080,
            #8b5cf6,
            #00d9ff
        );

    border-radius: 9px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 10px;

    font-size: 16px;

    box-shadow:
        0 0 12px rgba(255,0,128,.45),
        0 0 22px rgba(0,210,255,.20);

    color: #ffffff;
}

.header-text {
    color: #ffffff;

    font-size: 12px;
    font-weight: 800;

    letter-spacing: 1.8px;
    text-transform: uppercase;

    text-shadow:
        0 0 8px rgba(180,120,255,.45);
}

/* =========================================================
   MEMBER LIST
   ========================================================= */

#list {
    display: flex;
    flex-direction: column;

    gap: 8px;

    padding: 15px;

    position: relative;
}

/* =========================================================
   MEMBER BOX
   ========================================================= */

.member-box {
    background:
        linear-gradient(
            135deg,
            rgba(28,20,55,.94),
            rgba(10,12,30,.97)
        );

    border-radius: 11px;

    padding: 12px 13px;

    display: flex;
    align-items: center;

    gap: 12px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    border: 1px solid rgba(160,100,255,.20);

    position: relative;
    overflow: hidden;
}

/* Colour bar */

.member-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 3px;
    height: 100%;

    background:
        linear-gradient(
            180deg,
            #ff0080,
            #ff8a00,
            #ffe600,
            #00e5ff,
            #7c4dff
        );

    opacity: 0;

    transition: opacity .25s ease;
}

/* Moving shine */

.member-box::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transition: left .5s ease;

    pointer-events: none;
}

.member-box:hover {
    transform: translateX(4px);

    background:
        linear-gradient(
            135deg,
            rgba(45,25,75,.98),
            rgba(12,15,38,.98)
        );

    border-color: rgba(190,130,255,.55);

    box-shadow:
        0 5px 18px rgba(0,0,0,.55),
        0 0 18px rgba(150,70,255,.20);
}

.member-box:hover::before {
    opacity: 1;
}

.member-box:hover::after {
    left: 120%;
}

/* =========================================================
   RANK
   ========================================================= */

.rank-number {
    background:
        linear-gradient(
            145deg,
            rgba(255,0,128,.18),
            rgba(90,70,255,.22)
        );

    color: #e5c9ff;

    font-size: 11px;
    font-weight: 800;

    width: 22px;
    height: 22px;

    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border: 1px solid rgba(190,120,255,.35);
}

/* =========================================================
   AVATAR
   ========================================================= */

.avatar-wrapper {
    position: relative;
}

.avatar {
    width: 36px;
    height: 36px;

    border-radius: 10px;

    object-fit: cover;

    border: 2px solid rgba(120,210,255,.35);

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.member-box:hover .avatar {
    border-color: rgba(255,140,230,.80);

    box-shadow:
        0 0 12px rgba(255,70,180,.25);

    transform: scale(1.04);
}

/* =========================================================
   NEW BADGE
   ========================================================= */

.new-badge {
    position: absolute;

    top: -4px;
    right: -5px;

    background:
        linear-gradient(
            135deg,
            #ff0080,
            #ff8a00,
            #ffe600
        );

    color: #18001f;

    font-size: 6px;
    font-weight: 900;

    padding: 2px 6px;

    border-radius: 8px;

    text-transform: uppercase;
    letter-spacing: 1px;

    box-shadow:
        0 0 8px rgba(255,100,100,.45);
}

/* =========================================================
   MEMBER INFO
   ========================================================= */

.info-container {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 3px;

    overflow: hidden;
}

.name {
    color: #f3edff;

    font-size: 13px;
    font-weight: 650;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    transition: color .2s ease;
}

.member-box:hover .name {
    color: #ffffff;

    text-shadow:
        0 0 9px rgba(255,180,255,.45);
}

.time-ago {
    color: rgba(190,190,225,.62);

    font-size: 10px;

    display: flex;
    align-items: center;

    gap: 5px;
}

.time-ago::before {
    content: "♟";

    font-size: 8px;

    color: #b88cff;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading-text {
    color: rgba(210,190,245,.55);

    font-size: 11px;

    text-align: center;

    padding: 20px;

    font-style: italic;
}

/* =========================================================
   LINKS
   ========================================================= */

a {
    text-decoration: none;
    color: inherit;
}

</style>
</head>

<body>

<div class="vortex-card">

    <div class="header-section">

        <div class="header-icon">
            ♟
        </div>

        <div class="header-text">
            New Members
        </div>

    </div>

    <div id="list">

        <div class="loading-text">
            Exploring the variants...
        </div>

    </div>

</div>


<script>

/* =========================================================
   TIME AGO
   ========================================================= */

function timeAgo(date) {

    const seconds =
        Math.floor((Date.now() - date.getTime()) / 1000);

    if (seconds < 60)
        return "just now";

    const minutes =
        Math.floor(seconds / 60);

    if (minutes < 60)
        return minutes + "m ago";

    const hours =
        Math.floor(minutes / 60);

    if (hours < 24)
        return hours + "h ago";

    const days =
        Math.floor(hours / 24);

    if (days < 30)
        return days + "d ago";

    const months =
        Math.floor(days / 30);

    if (months < 12)
        return months + "mo ago";

    const years =
        Math.floor(months / 12);

    return years + "y ago";
}


/* =========================================================
   LOAD MEMBERS
   ========================================================= */

async function load() {

    const list =
        document.getElementById("list");

    const defaultPawn =
        "https://www.chess.com/bundles/web/images/user-image.007dad08.svg";

    try {

        const response = await fetch(
            "https://api.chess.com/pub/club/variant-lovers-club/members"
        );

        if (!response.ok)
            throw new Error("Chess.com API error");

        const data =
            await response.json();


        /* -------------------------------------------------
           COLLECT MEMBERS FROM ALL PERIODS
           ------------------------------------------------- */

        const combined = [
            ...(data.weekly || []),
            ...(data.monthly || []),
            ...(data.all_time || [])
        ];


        /* -------------------------------------------------
           REMOVE DUPLICATES
           ------------------------------------------------- */

        const uniqueMembers =
            new Map();

        combined.forEach(member => {

            const username =
                member.username;

            if (!username)
                return;

            const existing =
                uniqueMembers.get(
                    username.toLowerCase()
                );

            if (
                !existing ||
                Number(member.joined) >
                Number(existing.joined)
            ) {

                uniqueMembers.set(
                    username.toLowerCase(),
                    member
                );

            }

        });


        /* -------------------------------------------------
           SORT NEWEST FIRST
           ------------------------------------------------- */

        const newest =
            Array.from(uniqueMembers.values())
                .sort(
                    (a, b) =>
                        Number(b.joined) -
                        Number(a.joined)
                )
                .slice(0, 3);


        /* -------------------------------------------------
           NO MEMBERS
           ------------------------------------------------- */

        if (!newest.length) {

            list.innerHTML =
                "<div class='loading-text'>No new members found...</div>";

            return;
        }


        list.innerHTML = "";


        /* -------------------------------------------------
           LOAD PLAYER DATA
           ------------------------------------------------- */

        const members =
            await Promise.all(

                newest.map(async member => {

                    try {

                        const playerResponse =
                            await fetch(
                                `https://api.chess.com/pub/player/${encodeURIComponent(member.username)}`
                            );

                        const playerData =
                            await playerResponse.json();

                        return {

                            username:
                                member.username,

                            avatar:
                                playerData.avatar ||
                                defaultPawn,

                            joined:
                                Number(member.joined)

                        };

                    }

                    catch {

                        return {

                            username:
                                member.username,

                            avatar:
                                defaultPawn,

                            joined:
                                Number(member.joined)

                        };

                    }

                })

            );


        /* -------------------------------------------------
           DISPLAY MEMBERS
           ------------------------------------------------- */

        members.forEach(
            (member, index) => {

                const joinedDate =
                    new Date(
                        member.joined * 1000
                    );


                const memberHTML = `

                    <a
                        href="https://www.chess.com/member/${encodeURIComponent(member.username)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="member-box">

                            <div class="rank-number">
                                ${index + 1}
                            </div>

                            <div class="avatar-wrapper">

                                <img
                                    src="${member.avatar}"
                                    class="avatar"
                                    alt=""
                                    onerror="this.src='${defaultPawn}'"
                                >

                                <div class="new-badge">
                                    NEW
                                </div>

                            </div>

                            <div class="info-container">

                                <span class="name">
                                    ${member.username}
                                </span>

                                <span class="time-ago">
                                    ${timeAgo(joinedDate)}
                                </span>

                            </div>

                        </div>

                    </a>

                `;

                list.insertAdjacentHTML(
                    "beforeend",
                    memberHTML
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Variant Lovers Club:",
            error
        );

        list.innerHTML =
            "<div class='loading-text'>Unable to find the newest members...</div>";
    }
}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
