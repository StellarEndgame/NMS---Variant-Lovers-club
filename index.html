<!DOCTYPE html>
<html>
<head>
<style>
/* =========================================================
   🌈♟️ VARIANT LOVERS CLUB — NEW MEMBERS SIDEBAR
   ========================================================= */

html, body {
    background: transparent !important;
    background-color: transparent !important;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #ffffff;
}

/* =========================================================
   MAIN CARD
   ========================================================= */

.vortex-card {
    width: 240px;

    background:
        radial-gradient(circle at 0% 0%, rgba(255, 0, 128, 0.20), transparent 38%),
        radial-gradient(circle at 100% 0%, rgba(0, 200, 255, 0.20), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(120, 0, 255, 0.20), transparent 45%),
        linear-gradient(145deg, #090014 0%, #10102b 48%, #050014 100%);

    border: 1px solid rgba(180, 120, 255, 0.45);
    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.65),
        0 0 25px rgba(130, 50, 255, 0.18),
        inset 0 0 30px rgba(255, 255, 255, 0.025);

    padding: 0;
    position: relative;
    overflow: hidden;
}

/* =========================================================
   COLOURFUL ATMOSPHERE
   ========================================================= */

.vortex-card::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    top: -145px;
    right: -80px;

    background:
        conic-gradient(
            from 0deg,
            rgba(255, 0, 128, 0.20),
            rgba(255, 180, 0, 0.15),
            rgba(0, 255, 200, 0.18),
            rgba(80, 80, 255, 0.18),
            rgba(255, 0, 128, 0.20)
        );

    border-radius: 50%;

    filter: blur(20px);

    pointer-events: none;
}

/* Colourful particles */

.vortex-card::after {
    content: "♟   ✦   ♞   ✧   ♜   ·   ♝";

    position: absolute;

    top: 8px;
    right: 8px;

    color: rgba(255, 255, 255, 0.20);

    font-size: 8px;
    letter-spacing: 3px;

    pointer-events: none;
}

/* =========================================================
   HEADER
   ========================================================= */

.header-section {
    background:
        linear-gradient(
            135deg,
            rgba(35, 15, 70, 0.96),
            rgba(10, 15, 40, 0.97)
        );

    padding: 14px 16px;

    display: flex;
    align-items: center;

    border-bottom: 1px solid rgba(180, 100, 255, 0.30);

    position: relative;
}

/* Rainbow accent line */

.header-section::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -1px;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            #ff0080,
            #ff8a00,
            #ffe600,
            #00e5ff,
            #6c5ce7,
            #ff0080
        );

    opacity: 0.75;
}

/* Chess icon */

.header-icon {
    width: 30px;
    height: 30px;

    background:
        linear-gradient(
            135deg,
            #ff0080,
            #8b5cf6,
            #00d9ff
        );

    border-radius: 9px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 10px;

    font-size: 16px;

    box-shadow:
        0 0 12px rgba(255, 0, 128, 0.45),
        0 0 22px rgba(0, 210, 255, 0.20);

    color: #ffffff;

    text-shadow:
        0 0 8px rgba(255,255,255,0.6);
}

/* Header text */

.header-text {
    color: #ffffff;

    font-size: 12px;
    font-weight: 800;

    letter-spacing: 1.8px;

    text-transform: uppercase;

    font-family: "Segoe UI", Arial, sans-serif;

    text-shadow:
        0 0 8px rgba(180, 120, 255, 0.45);
}

/* =========================================================
   MEMBER LIST
   ========================================================= */

#list {
    display: flex;
    flex-direction: column;

    gap: 8px;

    position: relative;

    padding: 15px;
}

/* =========================================================
   MEMBER BOX
   ========================================================= */

.member-box {
    background:
        linear-gradient(
            135deg,
            rgba(28, 20, 55, 0.94),
            rgba(10, 12, 30, 0.97)
        );

    backdrop-filter: blur(10px);

    border-radius: 11px;

    padding: 12px 13px;

    display: flex;
    align-items: center;

    gap: 12px;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

    border: 1px solid rgba(160, 100, 255, 0.20);

    position: relative;

    overflow: hidden;
}

/* Colourful side glow */

.member-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 3px;
    height: 100%;

    background:
        linear-gradient(
            180deg,
            #ff0080,
            #ff8a00,
            #ffe600,
            #00e5ff,
            #7c4dff
        );

    opacity: 0;

    transition: opacity 0.25s ease;
}

/* Moving colour sweep */

.member-box::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.08),
            transparent
        );

    transition: left 0.5s ease;

    pointer-events: none;
}

/* =========================================================
   HOVER
   ========================================================= */

.member-box:hover {
    transform: translateX(4px);

    background:
        linear-gradient(
            135deg,
            rgba(45, 25, 75, 0.98),
            rgba(12, 15, 38, 0.98)
        );

    border-color: rgba(190, 130, 255, 0.55);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(150, 70, 255, 0.20);
}

.member-box:hover::before {
    opacity: 1;
}

.member-box:hover::after {
    left: 120%;
}

/* =========================================================
   RANK NUMBER
   ========================================================= */

.rank-number {
    background:
        linear-gradient(
            145deg,
            rgba(255, 0, 128, 0.18),
            rgba(90, 70, 255, 0.22)
        );

    color: #e5c9ff;

    font-size: 11px;
    font-weight: 800;

    width: 22px;
    height: 22px;

    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border: 1px solid rgba(190, 120, 255, 0.35);

    font-family: "Segoe UI", Arial, sans-serif;

    box-shadow:
        0 0 8px rgba(150, 70, 255, 0.12);
}

/* =========================================================
   AVATAR
   ========================================================= */

.avatar-wrapper {
    position: relative;
}

.avatar {
    width: 36px;
    height: 36px;

    border-radius: 10px;

    object-fit: cover;

    border: 2px solid rgba(120, 210, 255, 0.35);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}

.member-box:hover .avatar {
    border-color: rgba(255, 140, 230, 0.80);

    box-shadow:
        0 0 12px rgba(255, 70, 180, 0.25);

    transform: scale(1.04);
}

/* =========================================================
   NEW BADGE
   ========================================================= */

.new-badge {
    position: absolute;

    top: -4px;
    right: -5px;

    background:
        linear-gradient(
            135deg,
            #ff0080,
            #ff8a00,
            #ffe600
        );

    color: #18001f;

    font-size: 6px;
    font-weight: 900;

    padding: 2px 6px;

    border-radius: 8px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-family: "Segoe UI", Arial, sans-serif;

    box-shadow:
        0 0 8px rgba(255, 100, 100, 0.45);
}

/* =========================================================
   MEMBER INFO
   ========================================================= */

.info-container {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 3px;

    overflow: hidden;
}

/* Username */

.name {
    color: #f3edff;

    text-shadow:
        0 0 7px rgba(190, 140, 255, 0.25);

    font-size: 13px;
    font-weight: 650;

    text-decoration: none;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-family: "Segoe UI", Arial, sans-serif;

    transition: color 0.2s ease;
}

.member-box:hover .name {
    color: #ffffff;

    text-shadow:
        0 0 9px rgba(255, 180, 255, 0.45);
}

/* Time */

.time-ago {
    color: rgba(190, 190, 225, 0.62);

    font-size: 10px;

    display: flex;
    align-items: center;

    gap: 5px;

    font-family: "Segoe UI", Arial, sans-serif;
}

.time-ago::before {
    content: "♟";

    font-size: 8px;

    color: #b88cff;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading-text {
    color: rgba(210, 190, 245, 0.55);

    font-size: 11px;

    text-align: center;

    padding: 20px;

    font-style: italic;

    font-family: "Segoe UI", Arial, sans-serif;

    text-shadow:
        0 0 8px rgba(180, 100, 255, 0.20);
}

/* =========================================================
   LINKS
   ========================================================= */

a {
    text-decoration: none;
    color: inherit;
}
</style>
</head>

<body>

<div class="vortex-card">

    <div class="header-section">
        <div class="header-icon">♟</div>
        <div class="header-text">New Members</div>
    </div>

    <div id="list">
        <div class="loading-text">
            Exploring the variants...
        </div>
    </div>

</div>

<script>

/* =========================================================
   TIME AGO
   ========================================================= */

function timeAgo(date) {

    const seconds =
        Math.floor((new Date() - date) / 1000);

    let interval =
        Math.floor(seconds / 31536000);

    if (interval >= 1)
        return interval + "y ago";

    interval =
        Math.floor(seconds / 2592000);

    if (interval >= 1)
        return interval + "mo ago";

    interval =
        Math.floor(seconds / 86400);

    if (interval >= 1)
        return interval + "d ago";

    interval =
        Math.floor(seconds / 3600);

    if (interval >= 1)
        return interval + "h ago";

    interval =
        Math.floor(seconds / 60);

    if (interval >= 1)
        return interval + "m ago";

    return "just now";
}


/* =========================================================
   LOAD MEMBERS
   ========================================================= */

async function load() {

    const list =
        document.getElementById("list");

    const headers = {
        "User-Agent":
            "VariantLoversClubSidebar/1.0"
    };

    const defaultPawn =
        "https://www.chess.com/bundles/web/images/user-image.007dad08.svg";

    try {

        const r = await fetch(
            "https://api.chess.com/pub/club/variant-lovers-club/members",
            { headers }
        );

        const d = await r.json();

        const allMembers = [
            ...(d.weekly || []),
            ...(d.monthly || [])
        ];

        const top3 =
            allMembers
                .sort((a, b) =>
                    b.joined - a.joined
                )
                .slice(0, 3);

        list.innerHTML = "";

        const memberPromises =
            top3.map(m =>

                fetch(
                    `https://api.chess.com/pub/player/${m.username}`,
                    { headers }
                )

                .then(pR => pR.json())

                .then(pData => ({

                    username: m.username,

                    avatar:
                        (pData.avatar &&
                         pData.avatar !== "")
                            ? pData.avatar
                            : defaultPawn,

                    joined: m.joined

                }))

                .catch(err => {

                    console.error(err);

                    return {

                        username: m.username,

                        avatar: defaultPawn,

                        joined: m.joined
                    };

                })
            );


        const members =
            await Promise.all(memberPromises);


        members.forEach((member, index) => {

            const joinedDate =
                new Date(member.joined * 1000);


            const memberHTML = `

                <a
                    href="https://www.chess.com/member/${member.username}"
                    target="_blank"
                >

                    <div class="member-box">

                        <div class="rank-number">
                            ${index + 1}
                        </div>

                        <div class="avatar-wrapper">

                            <img
                                src="${member.avatar}"
                                class="avatar"
                                onerror="this.src='${defaultPawn}'"
                            >

                            <div class="new-badge">
                                NEW
                            </div>

                        </div>

                        <div class="info-container">

                            <span class="name">
                                ${member.username}
                            </span>

                            <span class="time-ago">
                                ${timeAgo(joinedDate)}
                            </span>

                        </div>

                    </div>

                </a>
            `;

            list.innerHTML += memberHTML;

        });

    }

    catch (e) {

        console.error(e);

        list.innerHTML =
            "<div class='loading-text'>The variants are hiding the members...</div>";
    }
}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
